name: CI/CD

on:
  push:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Pular os testes"
        type: boolean
        default: false
      run_migrations:
        description: "Rodar as migrations no deploy"
        type: boolean
        default: false

# Em push, inputs eh null e vale a mensagem do commit (a que voce edita no
# "Confirm merge"). Em workflow_dispatch vale a caixa marcada.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !inputs.skip_tests && !contains(github.event.head_commit.message || '', '[skip tests]') }}
        run: python app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Espera o clique em "Review deployments" -> Approve, no painel da Action.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Migrations
        if: ${{ inputs.run_migrations || contains(github.event.head_commit.message || '', '[run migrations]') }}
        run: echo "migrations rodadas"
      - run: echo "deployado"
