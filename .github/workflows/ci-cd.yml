name: CI/CD

on:
  push:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Pular os testes"
        type: boolean
        default: false
      run_migrations:
        description: "Rodar as migrations no deploy"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Em push, inputs.skip_tests eh null -> o step roda.
      - if: ${{ !inputs.skip_tests }}
        run: python app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Espera o clique em "Review deployments" -> Approve, no painel da Action.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Migrations
        # Opt-in: em push eh null -> pulado.
        if: ${{ inputs.run_migrations }}
        run: cat migrations/*.sql
      - run: echo "deployado"
